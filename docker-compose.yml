version: "3.9"

services:

  catalogs_service:
    build: ./catalogs_service
    container_name: catalogs_service
    ports:
      - "8001:8001"
    env_file:
      - ./catalogs_service/.env
    environment:
      - ENVIRONMENT=local

  notes_service:
    build: ./notes_service
    container_name: notes_service
    ports:
      - "8002:8002"
    env_file:
      - ./notes_service/.env
    environment:
      - ENVIRONMENT=local
      - CATALOGS_SERVICE_URL=http://catalogs_service:8001
      - BASE_URL=http://localhost:8002
    depends_on:
      - catalogs_service

  notification_service:
    build: ./notification_service
    container_name: notification_service
    ports:
      - "8003:8003"
    env_file:
      - ./notification_service/.env
    environment:
      - ENVIRONMENT=local
    depends_on:
      - notes_service